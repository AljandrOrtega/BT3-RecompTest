name: "3. Compilar Launcher y Release"

on:
  workflow_dispatch:

jobs:
  build-launcher-release:
    runs-on: windows-latest

    steps:
    # 1. Checkout básico sin submódulos pesados
    - name: Checkout repositorio
      uses: actions/checkout@v4
      with:
        submodules: false

    # 2. Habilitar Long Paths en Windows y Git
    - name: Habilitar Long Paths en Windows y Git
      shell: pwsh
      run: |
        git config --global core.longpaths true
        Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem' -Name 'LongPathsEnabled' -Value 1

    # 3. Descargar submódulos necesarios con profundidad 1
    - name: Descargar Submódulos
      shell: pwsh
      run: |
        git submodule update --init --recursive --depth 1

    # 4. Configurar Python (requerido para pefile, aqtinstall y scripts auxiliares)
    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    # 5. Configurar entorno MSVC en el Runner
    - name: Configurar entorno MSVC
      uses: ilammy/msvc-dev-cmd@v1

    # 6. Restaurar el binario del Runner compilado en el Flujo 2
    - name: Restaurar Caché del Runner
      uses: actions/cache@v4
      with:
        path: |
          build/
          games/bt3/work/
        key: runner-bin-${{ github.sha }}
        restore-keys: |
          runner-bin-

    # 7. Validar que los artefactos del Runner existan
    - name: Validar Binarios del Runner
      shell: pwsh
      run: |
        if (-not (Test-Path "build")) {
          throw "No se encontró la carpeta 'build' en la caché. Debes ejecutar primero el flujo '2. Compilar Runner'."
        }

    # 8. Instalar dependencias (Mesa Lavapipe, Qt, pefile) y ejecutar compilación/empaquetado
    - name: Instalar Dependencias, Compilar Launcher y Generar Package
      shell: pwsh
      run: |
        # 1. Garantiza la descarga de Mesa Lavapipe y paquetes de Python
        .\install-deps-windows.ps1 -Install

        # 2. Compila el Launcher, despliega DLLs (windeployqt), corre el PE gate y crea el ZIP final
        .\build-windows.ps1 -LauncherOnly -SkipDeps

    # 9. Subir el ZIP resultante generado por el script en build/release-windows/out/
    - name: Subir Release Artefacto
      uses: actions/upload-artifact@v4
      with:
        name: BT3-Recomp-Windows-x64
        path: build/release-windows/out/BT3-Recomp-x86_64.zip
