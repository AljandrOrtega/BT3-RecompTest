name: "3. Compilar Launcher y Release"

on:
  workflow_dispatch:
    inputs:
      runner_sha:
        description: 'SHA del commit que generó la caché del Runner'
        required: false
        type: string
  workflow_run:
    workflows: ["2. Compilar Runner"]
    types:
      - completed

permissions:
  contents: read
  actions: read

jobs:
  build-launcher-package:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: windows-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Configurar entorno C++ de MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Instalar Ninja y LLVM
        uses: llvm/actions/install-ninja@main

      # Solo restaura Qt y Mesa de la caché global previa (no ejecuta script de instalación)
      - name: Restaurar Caché Dependencias de Sistema (Qt/Mesa)
        uses: actions/cache/restore@v4
        with:
          path: |
            C:\Qt
            C:\tools
            ~\AppData\Local\pip\Cache
          key: deps-qt-mesa-v1

      # Restaurar Archivos del Runner y Work
      - name: Restaurar Caché de Runner y Work
        uses: actions/cache/restore@v4
        with:
          path: |
            build/stage
            games/bt3/work
          key: runner-work-${{ inputs.runner_sha || github.sha }}
          restore-keys: |
            runner-work-

      # PASO AISLADO: Compilación pura del Launcher
      - name: Compilar ÚNICAMENTE Launcher Qt y Empaquetar
        shell: powershell
        run: |
          $env:CXXFLAGS = "-w"
          $env:CFLAGS = "-w"
          .\build-windows.ps1 -SkipSetup -OutDir "build/release-windows/out"

      - name: Subir Release Final
        uses: actions/upload-artifact@v4
        with:
          name: BT3-Recomp-Windows-x86_64
          path: |
            build/release-windows/out/BT3-Recomp-x86_64.zip
            build/release-windows/out/*.sha256
