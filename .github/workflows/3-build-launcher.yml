name: "3. Compilar Launcher y Release"

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'ID de ejecucion de "2-build-runner" (opcional si ejecutas manualmente)'
        required: false
        type: string
  workflow_run:
    workflows: ["2-build-runner"]
    types:
      - completed

permissions:
  contents: read
  actions: read

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

jobs:
  build-launcher-package:
    # Evita ejecutarse si el workflow 2 fallo cuando se dispara automáticamente
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: windows-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Configurar entorno C++ de MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Instalar Ninja y LLVM
        uses: llvm/actions/install-ninja@main

      - name: Instalar dependencias de Qt y Sistema
        shell: powershell
        run: |
          .\install-deps-windows.ps1 -Install

      - name: Descargar Artifact del Runner
        uses: actions/download-artifact@v4
        with:
          name: runner-stage
          path: build/stage
          run-id: ${{ github.event.workflow_run.id || inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Obtener ISO desde Caché
        uses: actions/cache@v4
        with:
          path: bt3-usa.iso
          key: iso-bt3-slus21678

      - name: Compilar Launcher Qt y Empaquetar
        shell: powershell
        run: |
          .\build-windows.ps1 -Iso "bt3-usa.iso" -OutDir "build/release-windows/out"

      - name: Subir Release Final
        uses: actions/upload-artifact@v4
        with:
          name: BT3-Recomp-Windows-x86_64
          path: |
            build/release-windows/out/BT3-Recomp-x86_64.zip
            build/release-windows/out/*.sha256
