name: "3. Compilar Launcher y Release"

on:
  workflow_dispatch:
    inputs:
      runner_sha:
        description: 'SHA del commit que generó la caché del Runner (dejar vacío para usar HEAD)'
        required: false
        type: string
  workflow_run:
    workflows: ["2. Compilar Runner"]
    types:
      - completed

permissions:
  contents: read
  actions: read

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

jobs:
  build-launcher-package:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: windows-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Configurar entorno C++ de MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Instalar Ninja y LLVM
        uses: llvm/actions/install-ninja@main

      # CACHÉ 1: Dependencias del sistema / Qt / Mesa (Evita descargarlas nuevamente)
      - name: Caché Dependencias de Qt y Sistema
        id: cache-system-deps
        uses: actions/cache@v4
        with:
          path: |
            C:\Qt
            C:\tools
            ~\AppData\Local\pip\Cache
          key: deps-qt-mesa-v1

      - name: Instalar dependencias de Qt y Sistema (si no están en caché)
        if: steps.cache-system-deps.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          .\install-deps-windows.ps1 -Install

      # CACHÉ 2: Restaurar Archivos de Runner y Work generados en el Workflow 2
      - name: Restaurar Caché de Runner y Work
        uses: actions/cache/restore@v4
        with:
          path: |
            build/stage
            games/bt3/work
          key: runner-work-${{ inputs.runner_sha || github.sha }}
          restore-keys: |
            runner-work-

      # Compilar aisladamente solo el Launcher en su propia etapa limpia
      - name: Compilar ÚNICAMENTE Launcher Qt y Empaquetar
        shell: powershell
        run: |
          $env:CXXFLAGS = "-w"
          $env:CFLAGS = "-w"
          .\build-windows.ps1 -SkipSetup -OutDir "build/release-windows/out"

      - name: Subir Release Final
        uses: actions/upload-artifact@v4
        with:
          name: BT3-Recomp-Windows-x86_64
          path: |
            build/release-windows/out/BT3-Recomp-x86_64.zip
            build/release-windows/out/*.sha256
