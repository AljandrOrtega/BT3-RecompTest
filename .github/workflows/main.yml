name: Build Windows Release

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Configurar entorno C++ de MSVC Visual Studio
        uses: ilammy/msvc-dev-cmd@v1

      - name: Instalar Ninja y LLVM (Clang)
        uses: llvm/actions/install-ninja@main

      - name: Instalar dependencias y Qt6 nativamente
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          python -m pip install aqtinstall
          
          # Instalar Qt 6.6.3 en C:\Qt
          aqt install-qt windows desktop 6.6.3 win64_msvc2019_64 -o C:\Qt
          
          # Configurar variables de entorno correctamente en GitHub Actions con PowerShell
          "C:\Qt\6.6.3\msvc2019_64\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "QT_ROOT=C:\Qt\6.6.3\msvc2019_64" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "Qt6_DIR=C:\Qt\6.6.3\msvc2019_64\lib\cmake\Qt6" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          
          .\install-deps-windows.ps1 -Install

      - name: Restaurar / Guardar ISO en Caché
        id: cache-iso
        uses: actions/cache@v4
        with:
          path: bt3-usa.iso
          key: iso-bt3-slus21678

      - name: Descargar ISO con aria2 (Multi-hilo)
        if: steps.cache-iso.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          choco install aria2 --no-progress -y
          aria2c -x 16 -s 16 --check-certificate=false "https://archive.org/download/dbz-3-slus-21678/DBZ3_SLUS_21678.ISO" -o "bt3-usa.iso"

      - name: Compilar proyecto
        shell: powershell
        run: |
          $env:CFLAGS = "-w"
          $env:CXXFLAGS = "-w"
          
          # Forzar a la sesión actual a reconocer Qt antes de ejecutar el script
          $env:QT_ROOT = "C:\Qt\6.6.3\msvc2019_64"
          $env:Qt6_DIR = "C:\Qt\6.6.3\msvc2019_64\lib\cmake\Qt6"
          $env:PATH = "C:\Qt\6.6.3\msvc2019_64\bin;$env:PATH"

          .\build-windows.ps1 -Iso "bt3-usa.iso"

      - name: Empaquetar Release
        shell: powershell
        run: |
          .\package-windows.ps1

      - name: Subir Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BT3-Recomp-Windows-x86_64
          path: |
            build/release-windows/out/BT3-Recomp-x86_64.zip
            build/release-windows/out/*.sha256
